<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <div class="container">
        <div class="header">
            <h1>Temperature Converter</h1>
        </div>
        <div class="input1">
            <label for="input1">Enter temperature in Celsius:</label>
            <input type="number" id="celsius" placeholder="Enter your temperature in Celsius">
        </div>
        <div class="input2">
            <label for="input2">Enter temperature in Kelvin:</label>
            <input type="number" id="Kelvin" placeholder="Enter your temperature in Celsius">
        </div>
        <div class="input3">
            <label for="input3">Enter temperature in Farenheit:</label>
            <input type="number" id="Farenheit" placeholder="Enter your temperature in Celsius">
        </div>
    </div>

    <script src="index.js"></script>
</body>

</html>
