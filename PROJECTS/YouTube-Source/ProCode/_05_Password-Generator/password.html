<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="password.css">
</head>
<body>
    
    <div class="container-password">
        <div class="header">
            <h2>Password Generator</h2>
        </div>
        <div class="display">
            <input type="text" id="pass-input" placeholder="Password" disabled>
            <button id="copy">Copy</button>
        </div>
        <div class="setting">
            <label for="" id="length-label">Length</label>
            <input type="number" class="length-number" value="10" min="5" max="20" step="1">
        </div>
        <div class="setting">
            <label for="" id="Uppercase-label">Uppercase</label>
            <input type="checkbox" class="uppercase" checked>
        </div>
        <div class="setting">
            <label for="" id="Lowercase-label">Lowercase</label>
            <input type="checkbox" class="lowercase" checked>
        </div>
        <div class="setting">
            <label for="" id="Numbers-label">Numbers</label>
            <input type="checkbox" class="numbers" checked>
        </div>
        <div class="setting">
            <label for="" id="Symbols-label">Symbols</label>
            <input type="checkbox" class="symbols" checked>
        </div>
        <div class="generate-btn">
            <button id="generate">Generate</button>
        </div>

    </div>

    <script src="password.js"></script>
</body>
</html>
